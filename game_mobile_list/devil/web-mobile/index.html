<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cocos Creator | GameFrame</title>
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="x5-page-mode" content="app">

  <link rel="stylesheet" type="text/css" href="style.f76d1.css"/>
  
  <!-- 添加基础路径配置 -->
  <script>
    window.DEPLOY_BASE_PATH = 'https://leolilisisy.github.io/gameList/game_mobile_list/devil/web-mobile/';
    // 添加资源加载函数
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = window.DEPLOY_BASE_PATH + src;
        script.onload = resolve;
        script.onerror = reject;
        script.charset = 'utf-8';
        document.head.appendChild(script);
      });
    }
  </script>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
  </div>

  <script>
    // 按顺序加载所需文件
    async function loadGame() {
      try {
        // 加载 polyfills
        await loadScript('src/polyfills.bundle.5adbf.js');
        // 加载 system
        await loadScript('src/system.bundle.543e6.js');
        
        // 加载 import map
        const response = await fetch(window.DEPLOY_BASE_PATH + 'src/import-map.ed290.json');
        const importMap = await response.json();
        
        // 修改 import map 中的路径
        Object.keys(importMap.imports).forEach(key => {
          if (importMap.imports[key].startsWith('./')) {
            importMap.imports[key] = window.DEPLOY_BASE_PATH + importMap.imports[key].slice(2);
          }
        });
        
        // 应用 import map
        const script = document.createElement('script');
        script.type = 'systemjs-importmap';
        script.text = JSON.stringify(importMap);
        document.head.appendChild(script);
        
        // 加载主程序
        await System.import(window.DEPLOY_BASE_PATH + 'index.fe8d1.js');
      } catch (err) {
        console.error('Failed to load game:', err);
      }
    }

    // 启动游戏加载
    loadGame();
  </script>
</body>
</html>
