<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title data-i18n="game15Puzzle.title">15 Puzzle</title>
    <link rel="stylesheet" href="../shared/game-ui.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="puzzle">
        <header class="puzzle__header">
            <div class="game-page-toolbar">
                <button type="button" class="language-toggle-game" data-language-toggle></button>
            </div>
            <h1 data-i18n="game15Puzzle.title">15 Puzzle</h1>
            <div class="controls">
                <button id="shuffle" data-i18n="game15Puzzle.shuffle">Shuffle</button>
                <button id="solve" disabled data-i18n="game15Puzzle.autoSolve">Auto Solve</button>
            </div>
        </header>

        <section id="board" class="board" aria-label="15 puzzle board" data-i18n-aria-label="game15Puzzle.boardLabel"></section>
        <p class="hint" data-i18n="game15Puzzle.hint">Click/tap a tile adjacent to the empty space to slide. Arrange tiles 1–15 in order.</p>

        <script src="../../site-i18n.js"></script>
        <script src="script.js"></script>
    </main>
</body>

</html>
