<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="gameFlappy.title">Flappy Bird</title>
  <link rel="stylesheet" href="../shared/game-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrap" role="region" aria-label="Flappy Bird game container" data-i18n-aria-label="gameFlappy.containerLabel">
    <div class="game-page-toolbar">
      <button type="button" class="language-toggle-game" data-language-toggle></button>
    </div>
    <h1 data-i18n="gameFlappy.title">Flappy Bird</h1>
    <div class="canvas-outer">
      <canvas id="game" width="320" height="480"></canvas>
    </div>
    <div class="info" aria-live="polite">
      <div class="controls">
        <button id="startBtn" aria-label="Start or restart game" data-i18n="gameFlappy.startRestart">Start / Restart</button>
        <button id="pauseBtn" aria-pressed="false" aria-label="Pause or resume game" data-i18n="gameFlappy.pause">Pause</button>
      </div>
      <p data-i18n="gameFlappy.controls">Space, Enter, or click to flap. Press P to pause/resume.</p>
      <p id="score">Score: 0</p>
    </div>
    <footer data-i18n="gameFlappy.footer">Made for Mini JS Games Hub</footer>
  </div>
  <script src="../../site-i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
