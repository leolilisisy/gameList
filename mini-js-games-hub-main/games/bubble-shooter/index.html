<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="gameBubble.title">Bubble Shooter</title>
    <link rel="stylesheet" href="../shared/game-ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div class="game-page-toolbar">
            <button type="button" class="language-toggle-game" data-language-toggle></button>
        </div>
        <h1 data-i18n="gameBubble.title">Bubble Shooter</h1>
        <div id="score"><span data-i18n="gameBubble.score">Score</span>: <span id="score-value">0</span></div>
        <canvas id="game-canvas" width="600" height="700"></canvas>
        <div id="next-bubble"><span data-i18n="gameBubble.next">Next</span>: <div id="next-color"></div></div>
        <div id="level"><span data-i18n="gameBubble.level">Level</span>: <span id="level-value">1</span></div>
        <div id="instructions" data-i18n="gameBubble.instructions">Click to aim and shoot bubbles. Match 3 or more of the same color to pop them!</div>
        <div id="game-over" style="display: none;">
            <h2 data-i18n="gameBubble.gameOver">Game Over</h2>
            <p id="final-score">Final Score: 0</p>
            <button id="restart-btn" data-i18n="gameBubble.restart">Restart</button>
        </div>
        <div id="level-complete" style="display: none;">
            <h2 data-i18n="gameBubble.levelComplete">Level Complete!</h2>
            <button id="next-level-btn" data-i18n="gameBubble.nextLevel">Next Level</button>
        </div>
    </div>
    <script src="../../site-i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
