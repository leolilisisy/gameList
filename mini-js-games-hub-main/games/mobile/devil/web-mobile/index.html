<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cocos Creator | GameFrame</title>
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="x5-page-mode" content="app">

  <link rel="stylesheet" type="text/css" href="style.f76d1.css"/>
  
  <!-- 添加基础路径配置 -->
  <script>
    // 修正基础路径，确保包含 web-mobile
    window.DEPLOY_BASE_PATH = new URL('./', window.location.href).href;
    
    // 添加一个专门的引擎文件路径
    window.COCOS_JS_PATH = window.DEPLOY_BASE_PATH + 'cocos-js/';
    
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        // 如果是 cocos-js 目录下的文件，使用 COCOS_JS_PATH
        if (src.includes('cocos-js/')) {
          script.src = window.COCOS_JS_PATH + src.split('cocos-js/')[1];
        } else {
          script.src = window.DEPLOY_BASE_PATH + src;
        }
        script.onload = resolve;
        script.onerror = reject;
        script.charset = 'utf-8';
        document.head.appendChild(script);
      });
    }
  </script>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
  </div>

  <script>
    async function loadGame() {
      try {
        // 加载基础文件
        await loadScript('src/polyfills.bundle.5adbf.js');
        await loadScript('src/system.bundle.543e6.js');
        
        // 加载 import map
        const response = await fetch(window.DEPLOY_BASE_PATH + 'src/import-map.ed290.json');
        const importMap = await response.json();
        
        // 修改 import map 中的路径
        Object.keys(importMap.imports).forEach(key => {
          const value = importMap.imports[key];
          if (value.includes('cocos-js/')) {
            // 对于 cocos-js 目录下的文件使用专门的路径
            importMap.imports[key] = window.COCOS_JS_PATH + value.split('cocos-js/')[1];
          } else if (value.startsWith('./')) {
            // 对于其他相对路径文件
            importMap.imports[key] = window.DEPLOY_BASE_PATH + value.slice(2);
          }
        });
        
        // 应用修改后的 import map
        const script = document.createElement('script');
        script.type = 'systemjs-importmap';
        script.text = JSON.stringify(importMap);
        document.head.appendChild(script);
        
        // 加载主程序
        await System.import(window.DEPLOY_BASE_PATH + 'index.fe8d1.js');
      } catch (err) {
        console.error('Failed to load game:', err);
      }
    }

    loadGame();
  </script>
</body>
</html>
