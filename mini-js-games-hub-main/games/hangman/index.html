<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="gameHangman.title">Hangman</title>
  <link rel="stylesheet" href="../shared/game-ui.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="game-page-toolbar">
        <button type="button" class="language-toggle-game" data-language-toggle></button>
      </div>
      <h1 data-i18n="gameHangman.title">Hangman</h1>
      <p class="subtitle" data-i18n="gameHangman.subtitle">Guess the word before the man is hanged!</p>
    </header>

    <main>
      <div class="game-board">
        <div id="word" class="word">_ _ _ _ _</div>

        <div class="info-row">
          <div class="lives"><span data-i18n="gameHangman.lives">Lives</span>: <span id="lives">6</span></div>
          <div class="status" id="status"></div>
        </div>

        <div class="letters" id="letters"></div>

        <div class="guessed">
          <strong data-i18n="gameHangman.guessed">Guessed</strong>: <span id="guessed">—</span>
        </div>

        <div class="controls">
          <button id="new-game" data-i18n="gameHangman.newGame">New Game</button>
          <button id="give-up" data-i18n="gameHangman.giveUp">Give Up</button>
        </div>
      </div>

      <aside class="help">
        <h3 data-i18n="gameHangman.helpTitle">How to play</h3>
        <ol>
          <li data-i18n="gameHangman.help1">Click letters or press keys on your keyboard to guess.</li>
          <li data-i18n="gameHangman.help2">You have 6 wrong guesses.</li>
          <li data-i18n="gameHangman.help3">Win by guessing all letters before running out of lives.</li>
        </ol>
      </aside>
    </main>

    <footer>
      <a href="../../index.html" class="back" data-i18n="gameHangman.back">← Back to Games Hub</a>
    </footer>
  </div>

  <script src="../../site-i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
